# LoRA fine-tune for ACOS quad extraction. Read by both trainers:
#   train.py      PyTorch/PEFT, CUDA (SageMaker, rented GPUs)
#   train_mlx.py  MLX, local QLoRA on Apple silicon
# Everything outside the `mlx:` section is shared, so the two runs can't drift apart on
# hyperparameters. Evaluation and checkpointing happen once per epoch in both; logging counts
# OPTIMIZER steps.

model_id: Qwen/Qwen3-8B
max_seq_len: 1024
seed: 13

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  # 3, not 2, so the per-epoch checkpoints can show whether epoch 3 still helps rather than
  # assuming it. The best epoch by synthetic val loss becomes the final adapter.
  epochs: 3
  learning_rate: 1.0e-4
  # What the optimizer sees. Gradient accumulation is derived as effective / micro-batch, so
  # each model can use the largest micro-batch its memory allows (--batch-size) without
  # changing the optimization.
  effective_batch_size: 16
  # Default micro-batch. Qwen's vocab is 151,936 tokens, so the logits tensor
  # (batch x seq x vocab) dominates activation memory - ~0.3GB per example at seq 1024 in
  # bf16, before the loss upcasts it to fp32.
  per_device_train_batch_size: 2
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10

# bitsandbytes 4-bit, train.py on CUDA only. The MLX path quantizes ahead of time instead
# (see mlx.model_path).
quantization:
  load_in_4bit: true

# Generation-based eval on a val sample. Catches the failure modes loss cannot see:
# unparseable JSON, and spans the model invented rather than copied.
generation_eval:
  enabled: true
  num_samples: 16
  max_new_tokens: 512

# After training, train.py generates on every test file and writes predictions in the cache
# format evaluate.py --from-predictions reads. Gold targets top out at 438 tokens; 768 leaves
# room without letting a repetition loop run for thousands of tokens.
prediction:
  batch_size: 8
  max_new_tokens: 768

wandb:
  enabled: true
  project: review-absa

mlx:
  # Pre-converted 4-bit weights (affine, group size 64) - see BUILD_GUIDE Phase 5 for the
  # mlx_lm.convert command. Both models are quantized identically so the 8B-vs-4B comparison
  # isolates model size.
  model_path: ml/models/qwen3-8b-4bit
  # Micro-batch; accumulation is derived from training.effective_batch_size, same as train.py.
  batch_size: 1
  # mlx-lm defaults to LoRA on only the last 16 layers; PEFT adapts every layer. -1 = all.
  num_layers: -1
  grad_checkpoint: true
  val_batches: 50
