# LoRA fine-tune for ACOS quad extraction. Read by both trainers:
#   train.py      PyTorch/PEFT, CUDA (SageMaker, rented GPUs)
#   train_mlx.py  MLX, local QLoRA on Apple silicon
# Everything outside the `mlx:` section is shared, so the two runs can't drift apart on
# hyperparameters. Step counts (logging/eval/save, warmup) are in OPTIMIZER steps for both.

model_id: Qwen/Qwen3-8B
max_seq_len: 1024
seed: 13

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  epochs: 2
  learning_rate: 1.0e-4
  # Qwen's vocab is 151,936 tokens, so the logits tensor (batch x seq x vocab) dominates
  # memory, not the weights: at seq 1024 that is ~1.2GB per copy in bf16 before the loss
  # upcasts it to fp32. Keep the per-device batch small and buy the effective batch back
  # with accumulation.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_steps: 100
  save_steps: 200

# bitsandbytes 4-bit, train.py on CUDA only. The MLX path quantizes ahead of time instead
# (see mlx.model_path).
quantization:
  load_in_4bit: true

# Generation-based eval on a val sample. Catches the failure modes loss cannot see:
# unparseable JSON, and spans the model invented rather than copied.
generation_eval:
  enabled: true
  num_samples: 16
  max_new_tokens: 512

wandb:
  enabled: true
  project: review-absa

mlx:
  # Pre-converted 4-bit weights (affine, group size 64) - see BUILD_GUIDE Phase 5 for the
  # mlx_lm.convert command. Both models are quantized identically so the 8B-vs-4B comparison
  # isolates model size.
  model_path: ml/models/qwen3-8b-4bit
  # Micro-batch 1 x accumulation 16 = effective batch 16, the same as training above
  # (2 x 8). train_mlx.py refuses to run if the two products differ, since the runs would no
  # longer be comparable.
  batch_size: 1
  gradient_accumulation_steps: 16
  # mlx-lm defaults to LoRA on only the last 16 layers; PEFT adapts every layer. -1 = all.
  num_layers: -1
  grad_checkpoint: true
  val_batches: 50
